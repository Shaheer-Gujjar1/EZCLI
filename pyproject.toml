[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezcli"
version = "0.3.0"
description = "Terminal frontend wrapper for common Linux commands on Debian-based systems"
readme = "README.md"
authors = [{ name = "EasyCLI Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "rich>=12.0.0",
    "textual>=2.0.0",
]

[project.scripts]
ezcli = "ezcli_app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ezcli_app*"]
